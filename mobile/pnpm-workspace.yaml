# Ensure only packages released at least 1 day ago can be installed.
minimumReleaseAge: 1440

nodeLinker: "hoisted"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  esbuild: false
  msgpackr-extract: false
  react-native-audio-browser@https://codeload.github.com/MissingCore/react-native-audio-browser/tar.gz/ac538c60782b44151f21e7dc1195a0d449ae8666: true
  unrs-resolver: false

patchedDependencies:
  "@legendapp/list": patches/@legendapp__list.patch
  react-native-android-widget: patches/react-native-android-widget.patch
  react-native-gesture-handler: patches/react-native-gesture-handler.patch
  react-native-material-palette: patches/react-native-material-palette.patch

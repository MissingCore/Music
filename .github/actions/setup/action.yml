name: Setup Build Environment
description: Setup Node.js & Gradle and install dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 11
    - name: Setup Node.js with pnpm cache
      uses: actions/setup-node@v6
      with:
        cache: pnpm
        cache-dependency-path: mobile/pnpm-lock.yaml
        node-version-file: mobile/.nvmrc
    - name: Change global yarn version
      run: |
        corepack enable
        corepack use pnpm@latest-11
        corepack prepare yarn@4.13.0 --activate
      shell: bash

    # Seems like setting a default `working-directory` in a workflow that
    # uses this composite doesn't apply it to this file.
    - name: Install dependencies
      working-directory: mobile
      run: pnpm i --frozen-lockfile
      shell: bash

    - name: Setup JDK 18
      uses: actions/setup-java@v5
      with:
        java-version: 18
        distribution: temurin

    - name: Setup Gradle action for optimized execution and caching
      uses: gradle/actions/setup-gradle@v5
